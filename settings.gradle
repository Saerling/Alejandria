pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
}
rootProject.name = 'Alejandria'
include ':core'

// Cada carpeta src/<idioma>/<nombre> que tenga extension.properties es una extensión.
new File(rootDir, 'src').eachDir { idioma ->
    idioma.eachDir { ext ->
        if (new File(ext, 'extension.properties').exists()) {
            def nombre = ":${idioma.name}-${ext.name}"
            include nombre
            project(nombre).projectDir = ext
        }
    }
}
